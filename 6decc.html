<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header, footer,content</title>
    <article>
        <header>
          <h1>HEADER</h1>
          
        </header>
      
      </article>

<center> 
    
    <h2>GRIDS</h2>
    
</center>
     

      <div class="grid-container">
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
        <div class="grid-item">4</div>
        <div class="grid-item">5</div>
        <div class="grid-item">6</div>
        <div class="grid-item">7</div>
        <div class="grid-item">8</div>
        <div class="grid-item">9</div>
        <div class="grid-item">10</div>
        <div class="grid-item">11</div>
        <div class="grid-item">12</div>
    </div>

    <style>
           header {
            background-color:  #8a1111; 
            color: rgb(231, 206, 206);
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 4px rgba(218, 128, 128, 0.1);
        }

        footer {
            background-color:#8a1111;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 0.9em;
            margin-top: auto;
        }

        .grid-container {
          
            display: grid; 
            
            grid-template-columns: 1fr 1fr 1fr;
            
           
            gap: 20px; 

            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .grid-item {
            background-color: #3d192b; 
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            font-size: 1.5em;
           
            display: flex;
            justify-content: center;
            align-items: center;
        
            min-height: 100px; 
            box-shadow: #3d192b;
        }

    </style>

</head>

<body>
    <footer>
        <p>FOOTER</p>
    </footer>
</body>
</html>
